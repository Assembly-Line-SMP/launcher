name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes patchelf

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka

      - name: Build with Nuitka
        shell: bash
        run: |
          python -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --output-dir=dist \
            --output-filename=assemblylinelauncher \
            src/assemblylinelauncher.py

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: |
          mkdir -p AppDir/usr/bin
          cp -a dist/assemblylinelauncher.dist/. AppDir/usr/bin/
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy.AppImage
          chmod +x linuxdeploy.AppImage
          ./linuxdeploy.AppImage --appimage-extract-and-run \
            --appdir AppDir \
            --executable dist/assemblylinelauncher.dist/assemblylinelauncher \
            --desktop-file data/dev.kubabin.launcher.desktop.in \
            --icon-file data/icons/hicolor/scalable/apps/dev.kubabin.launcher.svg \
            --output appimage
          appimage_path="$(find . -maxdepth 1 -name 'AssemblyLineLauncher*.AppImage' -print -quit)"
          test -n "$appimage_path"
          mv "$appimage_path" dist/AssemblyLineLauncher-x86_64.AppImage

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-Linux
          path: dist/AssemblyLineLauncher-x86_64.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload standalone build
        if: runner.os != 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}
          path: dist/assemblylinelauncher.dist/
          if-no-files-found: error
          retention-days: 7
