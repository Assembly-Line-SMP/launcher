name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            meson \
            patchelf \
            wget

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build with Meson
        shell: bash
        run: |
          mkdir -p build/AppDir
          meson setup --prefix $PWD/build/AppDir/usr build/builddir
          meson compile -C build/builddir
          meson install -C build/builddir

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        uses: AppImageCrafters/build-appimage-action@master
        with:
          args: "--appdir=build/AppDir --build-dir=build/appimage-build --skip-test"
          recipe: AppImageBuilder.yml

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-Linux
          path: build/AssemblyLineLauncher*.AppImage
          if-no-files-found: error
          retention-days: 7
