name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            meson \
            patchelf \
            wget \
            gettext \
            desktop-file-utils \
            appstream \
            libglib2.0-bin \
            pkg-config \
            python3 \
            python3-venv \
            python3-gi \
            python3-gi-cairo \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgtk-4-dev \
            libadwaita-1-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install desktop-file-utils gettext gtk4 libadwaita meson ninja pygobject3
          echo "$(brew --prefix gettext)/bin" >> "$GITHUB_PATH"

      - name: Set up MSYS2 GTK toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            desktop-file-utils:p
            gcc:p
            gettext-tools:p
            gtk4:p
            libadwaita:p
            meson:p
            ninja:p
            python:p
            python-gobject:p
            python-httpx:p
            python-nuitka:p
            python-pip:p

      - name: Install Unix Python packaging dependencies
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build
          python3 -m venv --system-site-packages build/.venv
          source build/.venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt nuitka

      - name: Build with Meson (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/AppDir
          meson setup --prefix $PWD/build/AppDir/usr build/builddir
          meson compile -C build/builddir
          meson install -C build/builddir

      - name: Build with Meson (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build/AppDir
          meson setup --prefix "$PWD/build/AppDir/usr" build/builddir
          meson compile -C build/builddir
          meson install -C build/builddir

      - name: Build Nuitka standalone (Linux and macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          source build/.venv/bin/activate
          cd build/builddir/src/nuitka-package
          python -m nuitka \
            --mode=standalone \
            --include-package=assemblylinelauncher \
            --include-data-file=assemblylinelauncher.gresource=assemblylinelauncher.gresource \
            --output-dir=../../../nuitka-dist \
            main.py

      - name: Build Nuitka standalone (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cd build/builddir/src/nuitka-package
          python -m nuitka \
            --mode=standalone \
            --include-package=assemblylinelauncher \
            --include-data-file=assemblylinelauncher.gresource=assemblylinelauncher.gresource \
            --output-dir=../../../nuitka-dist \
            main.py

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        uses: AppImageCrafters/build-appimage-action@master
        with:
          args: "--appdir=build/AppDir --build-dir=build/appimage-build --skip-test"
          recipe: AppImageBuilder.yml

      - name: Upload Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: launcher-Linux
          path: build/AssemblyLineLauncher*.AppImage
          if-no-files-found: error
          retention-days: 7

      - name: Upload Nuitka standalone
        uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ runner.os }}-Nuitka
          path: build/nuitka-dist/main.dist/
          if-no-files-found: error
          retention-days: 7
