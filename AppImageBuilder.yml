# appimage-builder recipe see https://appimage-builder.readthedocs.io for details
version: 1
AppDir:
  path: ./build/AppDir
  app_info:
    id: dev.kubabin.launcher
    name: AssemblyLineLauncher
    version: latest
    exec: /usr/bin/python
    exec_args: /usr/bin/assemblylinelauncher
  runtime:
    arch: [ x86_64 ]
  pacman:
    Architecture: x86_64
    repositories:
      core:
        - https://johannesburg.mirror.pkgbuild.com/core/os/x86_64
      extra:
        - https://johannesburg.mirror.pkgbuild.com/extra/os/x86_64
    include: 
      - python
      - python-pip
    exclude: []
    options:
      SigLevel: "Optional TrustAll"
  apt:
    arch: [ amd64 ]
    include:
      - python3
      - python3-pip
    exclude: []
  files:
    include: []
    exclude:
    - usr/share/man
    - usr/share/doc/*/README.*
    - usr/share/doc/*/changelog.*
    - usr/share/doc/*/NEWS.*
    - usr/share/doc/*/TODO.*
  test:
    fedora-30:
      image: appimagecrafters/tests-env:fedora-30
      command: ./AppRun
    debian-stable:
      image: appimagecrafters/tests-env:debian-stable
      command: ./AppRun
    archlinux-latest:
      image: appimagecrafters/tests-env:archlinux-latest
      command: ./AppRun
    centos-7:
      image: appimagecrafters/tests-env:centos-7
      command: ./AppRun
    ubuntu-xenial:
      image: appimagecrafters/tests-env:ubuntu-xenial
      command: ./AppRun
AppImage:
  arch: x86_64
  update-information: guess
